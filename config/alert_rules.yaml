alerts:
  - name: high_tail_latency
    severity: critical
    condition: 'latency_p95_ms > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#incidents"
    owner: platform-team
    runbook: docs/alerts.md#alert-1

  - name: retrieval_failure_spike
    severity: high
    condition: 'retrieval_success_rate_pct < 90'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#incidents"
    owner: rag-team
    runbook: docs/alerts.md#alert-2

  - name: error_rate_elevation
    severity: high
    condition: 'error_rate_pct > 2'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#incidents"
    owner: platform-team
    runbook: docs/alerts.md#alert-3
